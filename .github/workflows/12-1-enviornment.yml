name: Environment-Demo
on:
    workflow_dispatch:
jobs:
    deploy-dev:
          name: Depolyment to dev
          runs-on: ubuntu-latest
          environment:
            name: development
            url: https://dev.i27academy.com
          steps: 
            - run: |
                echo "depolying to dev environment"
                echo " ========================="
                echo "Stging environment variables"
                echo "STAGE_DB_URL : ${{ vars.APP_NAME }}"
                echo "+++++++++++++++++++++++"


    deploy-staging:
          name: Depolyment to stage
          runs-on: ubuntu-latest
          needs: deploy-dev
          environment:
            name: staging
            url: https://stage.i27academy.com
          steps: 
            - run: |
                echo "depolying to stage environment"
                echo " ========================="
                echo "Stging environment variables"
                echo "STAGE_DB_URL : ${{ vars.STAGE_DB_URL }}"
                echo "+++++++++++++++++++++++"


    deploy-production:
          name: Depolyment to Prod
          runs-on: ubuntu-latest
          needs: deploy-staging
          environment:
            name: production
            url: https://i27academy.com
          steps: 
            - run: |
                echo "depolying to prod environment"
                echo " ========================="
                echo "Prod environment variables"
                echo "PROD_DB_URL : ${{ vars.PROD_DB_URL }}"
                echo "+++++++++++++++++++++++"
