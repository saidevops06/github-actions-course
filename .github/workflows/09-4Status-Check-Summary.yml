name: status-check-summary
on:
    workflow-dispatch:
jobs:
    status-function-demo:
        runs-on: ubuntu-latest
        steps:
          - name: step1 runs normally
            run: echo "step1 completed successfully"
          - name: step2  - fails intenionally
            run: |
                echo "this step will fail"
                exit 1
          - name: step 3 - success()
            if: success()
            run: echo " this will run only if all the previous steps are passed"
          - name : step 4 - failure runs because step 2 is failed 
            if: failure()
            run: echo "A previous step is failed,running some cleanup activity"
          - name: step 5 -  always run 
            if: always()
            run: echo "This will run always - perfect for reporting "
    notify-on-failure:
        runs-on: ubuntu-latest
        needs: status-check-summary
        if: failure()
        steps:
        - name: Send Alert
          run: |    
           echo "job failed - sending notification"
           echo "Branch is - : ${{github.ref_name}}"
           echo "Actor is - : ${{github.actor}}"
    final-summary:
        runs-on: ubuntu-latest
        needs: [ status-functions-demo, notify-on-failure ]
        if: always()
        steps: 
           - name: Write summary 
             run: |
              echo "##Pipeline summary" >> $GITHUB_STEP_SUMMARY
              echo "| Job | Result | " >> $GITHUB_STEP_SUMMARY
              echo "|----| ----|" >> $GITHUB_STEP_SUMMARY
              echo "| status-function-demo | ${{needs.status-functions-demo.result}} |" >> $GITHUB_STEP_SUMMARY
              echo "| notify-on-failure | ${{needs.notify-on-failure.result}} |" >> $GITHUB_STEP_SUMMARY

         
